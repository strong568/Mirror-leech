name: Mirror Leech Bot

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Nhập link cần mirror (SourceForge, Direct link...)'
        required: true
      huggingface_repo:
        description: 'Repo Hugging Face lưu trữ (ví dụ: Strong568/Mirror-Cloud)'
        required: false
        default: 'Strong568/Mirror-Cloud'
      gdrive_folder:
        description: 'Thư mục trên Google Drive (nếu dùng rclone)'
        required: false
        default: 'Mirror-Leech'

jobs:
  mirror_task:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 curl
          curl https://rclone.org/install.sh | sudo bash
          pip install -r requirements.txt

      - name: Execute Mirror & Leech
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.huggingface_repo }}
          HF_REPO_TYPE: 'model'
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          GDRIVE_DIR: ${{ inputs.gdrive_folder }}
        run: |
          chmod +x scripts/mirror_core.sh
          bash scripts/mirror_core.sh "${{ inputs.source_url }}"
          
