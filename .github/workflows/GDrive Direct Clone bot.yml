name: GDrive Direct Clone Bot

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Google Drive File hoặc Folder URL nguồn"
        required: true
      dest_folder:
        description: "Tên thư mục đích trên Google Drive của bạn (VD: Mirror-Leech hoặc ID thư mục)"
        required: false
        default: "Mirror-Leech"

jobs:
  server_side_clone:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt công cụ và thư viện
        run: |
          sudo apt update
          sudo apt install -y curl jq
          curl -s https://rclone.org/install.sh | sudo bash
          pip install --no-cache-dir gdown

      - name: Thiết lập cấu hình Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONFIG_DATA" ]; then
            echo "❌ Lỗi: Chưa cung cấp secret RCLONE_CONFIG!"
            exit 1
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          # Tự động phát hiện tên remote Drive đầu tiên trong file rclone.conf
          REMOTE_NAME=$(sed -n 's/^\[\(.*\)\]/\1/p' ~/.config/rclone/rclone.conf | head -n 1)
          if [ -z "$REMOTE_NAME" ]; then
            REMOTE_NAME="gdrive"
          fi
          echo "REMOTE_NAME=$REMOTE_NAME" >> $GITHUB_ENV
          echo "🔍 Sử dụng Remote Rclone: $REMOTE_NAME"

      - name: Thực thi sao chép & Bypass Quota
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          DEST_FOLDER: ${{ github.event.inputs.dest_folder }}
        run: |
          # 1. Trích xuất ID sạch từ URL
          CLEAN_URL="${SOURCE_URL%%\?*}"
          TARGET_ID=$(echo "$CLEAN_URL" | grep -oE '[a-zA-Z0-9_-]{25,}' | tail -1)
          if [ -z "$TARGET_ID" ]; then
            TARGET_ID=$(echo "$SOURCE_URL" | sed -n 's/.*id=\([a-zA-Z0-9_-]*\).*/\1/p')
          fi

          if [ -z "$TARGET_ID" ]; then
            echo "❌ Không trích xuất được Google Drive ID từ URL: $SOURCE_URL"
            exit 1
          fi

          echo "🎯 Target ID: $TARGET_ID"
          echo "📁 Thư mục đích: $DEST_FOLDER"
          mkdir -p workdir

          # 2. Tạo thư mục đích trên Google Drive
          rclone mkdir "${REMOTE_NAME}:${DEST_FOLDER}"

          # 3. Phương thức 1: Server-side Copy qua backend copyid (Hỗ trợ cả File đơn lẻ)
          echo "🚀 [Phương thức 1] Thử nghiệm Server-side copy trực tiếp..."
          SUCCESS=0
          if rclone backend copyid "${REMOTE_NAME}:" "$TARGET_ID" "${REMOTE_NAME}:${DEST_FOLDER}" 2>&1 | tee copyid.log; then
            if ! grep -qi "error" copyid.log; then
              echo "✅ Sao chép thành công qua Rclone Backend copyid!"
              SUCCESS=1
            fi
          fi

          # 4. Phương thức 2: Server-side Folder Copy (Nếu nguồn là Folder)
          if [ $SUCCESS -eq 0 ]; then
            echo "🔄 [Phương thức 2] Thử nghiệm Server-side Folder clone..."
            if rclone copy "${REMOTE_NAME},root_folder_id=${TARGET_ID}:" "${REMOTE_NAME}:${DEST_FOLDER}" \
                --drive-server-side-copy \
                --drive-acknowledge-abuse \
                --fast-list \
                -v; then
              echo "✅ Sao chép Folder Server-side thành công!"
              SUCCESS=1
            fi
          fi

          # 5. Phương thức 3: Bypass Quota Exceeded qua gdown và đồng bộ ngược lên Drive
          if [ $SUCCESS -eq 0 ]; then
            echo "⚠️ [Phương thức 3] Kích hoạt chế độ Bypass Quota Exceeded qua VM Relay..."
            cd workdir
            
            # gdown hỗ trợ tải file vượt hạn mức hoặc link chia sẻ bị nghẽn
            gdown --fuzzy "$SOURCE_URL" --continue \vert{}\vert{} gdown --id "$TARGET_ID" --continue

            DOWNLOADED_FILES=$(ls -A .)
            if [ -n "$DOWNLOADED_FILES" ]; then
              echo "📦 File đã tải về VM, đang đẩy lên Google Drive..."
              rclone move . "${REMOTE_NAME}:${DEST_FOLDER}/" -v --drive-chunk-size 64M
              SUCCESS=1
            else
              echo "❌ Thất bại: Không thể tải file qua cơ chế Bypass."
              exit 1
            fi
            cd ..
          fi

          # 6. Lấy thống kê kết quả để hiển thị ra Summary
          echo "📊 Đang truy xuất danh sách file trong thư mục đích..."
          rclone lsjson "${REMOTE_NAME}:${DEST_FOLDER}" > files_result.json
          
          python3 - << 'PYEOF'
          import json, os

          def human_readable_size(size_bytes):
              if not size_bytes: return "0 B"
              size_name = ("B", "KB", "MB", "GB", "TB")
              i = 0
              p = float(size_bytes)
              while p >= 1024 and i < len(size_name) - 1:
                  p /= 1024.0
                  i += 1
              return f"{p:.2f} {size_name[i]}"

          try:
              with open("files_result.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              
              total_bytes = sum(item.get("Size", 0) for item in data if not item.get("IsDir"))
              total_files = sum(1 for item in data if not item.get("IsDir"))
              total_dirs = sum(1 for item in data if item.get("IsDir"))

              with open("summary_output.md", "w", encoding="utf-8") as f:
                  for item in data:
                      if not item.get("IsDir"):
                          f.write(f"- 📄 **{item.get('Name')}** ({human_readable_size(item.get('Size', 0))})\n")

              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_f:
                  env_f.write(f"TOTAL_SIZE={human_readable_size(total_bytes)}\n")
                  env_f.write(f"TOTAL_FILES={total_files}\n")
                  env_f.write(f"TOTAL_DIRS={total_dirs}\n")
          except Exception as e:
              print(f"Error parsing json: {e}")
          PYEOF

      - name: Workflow Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            {
              echo "### ✅ Hoàn tất sao chép sang Google Drive"
              echo ""
              echo "#### 📥 Nguồn (Input):"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- **Dung lượng tổng:** \`${TOTAL_SIZE:-Không xác định}\`"
              echo "- **Số file:** \`${TOTAL_FILES:-0}\` | **Số thư mục:** \`${TOTAL_DIRS:-0}\`"
              echo ""
              echo "#### 📤 Đích đến (Output):"
              echo "- **Thư mục đích:** \`${{ github.event.inputs.dest_folder }}\`"
              echo ""
              echo "##### 📄 Danh sách file:"
              cat summary_output.md 2>/dev/null || echo "Hoàn tất chuyển đổi dữ liệu."
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ❌ Quá trình sao chép thất bại"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- File bị khóa bản quyền gắt gao hoặc tài khoản Drive đích không còn đủ dung lượng trống."
            } >> $GITHUB_STEP_SUMMARY
          fi
       fileId=file_id,
                          body=body,
                          supportsAllDrives=True,
                          fields="id, name, size"
                      ).execute()
                  except HttpError as e:
                      if e.resp.status in [403, 429]:
                          print(f"⚠️ Phát hiện giới hạn hạn mức (Quota/Rate limit 403): {e.reason}")
                          if not file_name:
                              meta = self.get_metadata(file_id)
                              file_name = meta.get("name", "unnamed_file")
                          return self.download_and_upload_fallback(file_id, file_name, dest_id)
                      raise e

              def clone_folder(self, folder_name, folder_id, dest_parent_id):
                  print(f"📁 Bắt đầu duyệt thư mục: {folder_name}")
                  items = self.get_files_in_folder(folder_id)
                  for item in items:
                      if item.get("mimeType") == G_DRIVE_DIR_MIME_TYPE:
                          self.total_folders += 1
                          sub_folder_id = self.create_directory(item.get("name"), dest_parent_id)
                          self.clone_folder(item.get("name"), item.get("id"), sub_folder_id)
                      else:
                          self.total_files += 1
                          copied = self.copy_file_safe(item.get("id"), dest_parent_id, item.get("name"))
                          file_size = int(copied.get("size") or item.get("size") or 0)
                          self.total_bytes += file_size
                          self.file_details.append((copied.get("name"), file_size, copied.get("id")))
                          print(f"  └─ Đã sao chép: {copied.get('name')} ({human_readable_size(file_size)})")

              def clone(self, source_url, dest_folder_input):
                  target_id = extract_id(source_url)
                  meta = self.get_metadata(target_id)
                  mime_type = meta.get("mimeType")
                  name = meta.get("name")

                  dest_id = self.get_or_create_destination(dest_folder_input)

                  if mime_type == G_DRIVE_DIR_MIME_TYPE:
                      dest_dir_id = self.create_directory(name, dest_id)
                      self.clone_folder(name, target_id, dest_dir_id)
                      final_dest_id = dest_dir_id
                  else:
                      self.total_files = 1
                      copied = self.copy_file_safe(target_id, dest_id, name)
                      file_size = int(copied.get("size") or meta.get("size") or 0)
                      self.total_bytes += file_size
                      self.file_details.append((copied.get("name"), file_size, copied.get("id")))
                      final_dest_id = dest_id

                  return name, final_dest_id

          def main():
              source_url = os.environ.get("SOURCE_URL")
              dest_folder = os.environ.get("DEST_FOLDER", "Mirror-Leech")

              service = get_drive_service()
              cloner = DriveCloner(service)

              print("🚀 Bắt đầu nhân bản Google Drive...")
              name, final_dest_id = cloner.clone(source_url, dest_folder)

              with open("summary_output.md", "w", encoding="utf-8") as f:
                  for fname, fsize, fid in cloner.file_details:
                      f.write(f"- 📄 **{fname}** ({human_readable_size(fsize)}) - [👉 Mở file](https://drive.google.com/file/d/{fid}/view?usp=sharing)\n")

              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_f:
                  env_f.write(f"INPUT_NAME={name}\n")
                  env_f.write(f"INPUT_SIZE={human_readable_size(cloner.total_bytes)}\n")
                  env_f.write(f"TOTAL_FILES={cloner.total_files}\n")
                  env_f.write(f"TOTAL_FOLDERS={cloner.total_folders}\n")
                  env_f.write(f"DEST_LINK=https://drive.google.com/drive/folders/{final_dest_id}\n")

          if __name__ == "__main__":
              main()
          EOF

          python clone_runner.py

      - name: Workflow Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            {
              echo "### ✅ Hoàn tất sao chép sang Google Drive"
              echo ""
              echo "#### 📥 Nguồn (Input):"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- **Tên nguồn:** \`${INPUT_NAME}\`"
              echo "- **Dung lượng tổng:** \`${INPUT_SIZE}\`"
              echo "- **Số file:** \`${TOTAL_FILES}\` | **Số thư mục:** \`${TOTAL_FOLDERS}\`"
              echo ""
              echo "#### 📤 Đích đến (Output):"
              if [ -n "${DEST_LINK:-}" ]; then
                echo "- **Link thư mục đích:** [Mở thư mục trên Google Drive](${DEST_LINK})"
              fi
              echo ""
              echo "##### 📄 Danh sách file đã nhân bản:"
              cat summary_output.md 2>/dev/null || echo "Không có file nào."
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ❌ Thao tác sao chép thất bại"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- Vui lòng kiểm tra lại quyền truy cập hoặc dung lượng trống tài khoản."
            } >> $GITHUB_STEP_SUMMARY
          fi
